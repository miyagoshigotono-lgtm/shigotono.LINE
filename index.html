<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="注記配置">
<meta name="theme-color" content="#f3f3f3">
<link rel="manifest" href="./manifest.json">
<link rel="icon" id="appIcon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>注記配置</title>
<style>
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
}

body {
  font-family: 'Yu Gothic UI', 'Meiryo', 'MS UI Gothic', 'メイリオ', sans-serif;
  font-size: 12px;
  background: #f0f0f0;
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
}

/* ─── ダイアログ本体 ─── */
.dlg {
  width: 320px;
  background: #f0f0f0;
  border: none;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  border-radius: 0;
  overflow: hidden;
}

/* ─── タイトルバー ─── */
.titlebar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 4px 4px 8px;
  background: #f3f3f3;
  border-bottom: 1px solid #dfdfdf;
  height: 24px;
  flex-shrink: 0;
}
.titlebar-text {
  font-size: 12px;
  color: #000;
  line-height: 1;
}
.titlebar-close {
  width: 20px;
  height: 16px;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 14px;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  line-height: 1;
}
.titlebar-close:hover { background: #c42b1c; color: #fff; }

/* ─── 本体 ─── */
.body {
  padding: 8px 8px 6px 8px;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* ─── セレクト(フルwidth) ─── */
select.sel {
  width: 100%;
  height: 22px;
  border: 1px solid #8d8d8d;
  background: #fff;
  font-family: inherit;
  font-size: 12px;
  padding: 0 2px;
  color: #000;
  margin-bottom: 3px;
  appearance: auto;
  cursor: pointer;
}
select.sel:focus {
  outline: 2px solid #005fb7;
  outline-offset: -2px;
}

/* ─── テキストエリア（受信） ─── */
textarea.ta-recv {
  width: 100%;
  height: 94px;
  border: 1px solid #8d8d8d;
  background: #fff;
  font-family: inherit;
  font-size: 11px;
  padding: 2px 3px;
  resize: none;
  margin-bottom: 3px;
  color: #000;
  overflow-y: scroll;
}

/* ─── テキストエリア（返信/新規送信） ─── */
textarea.ta-reply {
  width: 100%;
  height: 44px;
  border: 1px solid #8d8d8d;
  background: #fff;
  font-family: inherit;
  font-size: 11px;
  padding: 2px 3px;
  resize: none;
  margin-bottom: 3px;
  color: #000;
}
textarea.ta-reply:focus {
  outline: 2px solid #005fb7;
  outline-offset: -2px;
}

/* ─── ボタン基底 ─── */
button.btn {
  height: 23px;
  padding: 0 10px;
  background: #e1e1e1;
  border: 1px solid #adadad;
  font-family: inherit;
  font-size: 12px;
  color: #000;
  cursor: pointer;
  white-space: nowrap;
}
button.btn:hover { background: #cce4f7; border-color: #005fb7; }
button.btn:active { background: #99c8ef; }

/* ─── マスター登録（右寄せ） ─── */
.master-row {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 6px;
}

/* ─── 基本/表示 タブ ─── */
.tabs {
  display: flex;
  gap: 14px;
  border-bottom: 1px solid #c8c8c8;
  padding: 0 0 2px 2px;
  margin-bottom: 6px;
}
.tab {
  font-size: 12px;
  color: #000;
  cursor: pointer;
  padding-bottom: 2px;
  border-bottom: 2px solid transparent;
  margin-bottom: -3px;
}
.tab.active { border-bottom: 2px solid #444; }

/* ─── 設定グリッド（2カラム） ─── */
.settings {
  display: grid;
  grid-template-columns: 106px 1fr;
  gap: 0 6px;
  margin-bottom: 4px;
}
.col-l {}
.col-r {}

label.cb {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  height: 19px;
  cursor: pointer;
  color: #000;
}
label.cb.disabled { color: #a0a0a0; pointer-events: none; }
input[type="checkbox"] { width: 13px; height: 13px; cursor: pointer; flex-shrink: 0; }
input[type="radio"]    { width: 13px; height: 13px; cursor: pointer; flex-shrink: 0; }

.srow {
  display: flex;
  align-items: center;
  gap: 3px;
  height: 19px;
  margin-bottom: 1px;
}
.slbl {
  font-size: 12px;
  white-space: nowrap;
  color: #000;
  flex-shrink: 0;
}

select.ssel {
  height: 20px;
  border: 1px solid #8d8d8d;
  background: #fff;
  font-family: inherit;
  font-size: 11px;
  padding: 0 1px;
  color: #000;
  flex: 1;
  min-width: 0;
}

input.angle {
  width: 28px;
  height: 20px;
  border: 1px solid #8d8d8d;
  background: #fff;
  font-size: 11px;
  text-align: right;
  padding: 0 2px;
}

.swatch {
  display: inline-block;
  width: 14px;
  height: 14px;
  background: #1a1a1a;
  border: 1px solid #555;
  flex-shrink: 0;
}

.kijun {
  display: flex;
  align-items: center;
  gap: 3px;
  height: 19px;
  margin-top: 1px;
}

.sep {
  border: none;
  border-top: 1px solid #c0c0c0;
  margin: 5px 0 5px 0;
}

.bottom {
  display: flex;
  gap: 4px;
  align-items: flex-start;
}
.b-left  { flex: 0 0 72px; }
.b-mid   { flex: 1; min-width: 0; }
.b-right { flex: 0 0 62px; display: flex; flex-direction: column; gap: 4px; align-items: stretch; }

.radio-row {
  display: flex;
  align-items: center;
  gap: 3px;
  height: 19px;
  font-size: 11px;
  flex-wrap: nowrap;
}
.radio-row label {
  display: flex;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  white-space: nowrap;
  font-size: 11px;
}

.statusbar {
  font-size: 10px;
  color: #444;
  background: #e8e8e8;
  border-top: 1px solid #c8c8c8;
  padding: 2px 6px;
  flex-shrink: 0;
}

/* ─── PWAスタンドアロン時 ─── */
@media (display-mode: standalone) {
  .titlebar { display: none; }
  body { padding: 0; margin: 0; }
  .dlg { width: 100%; min-height: 100vh; }
}

</style>
</head>
<body>
<div class="dlg">

  <!-- タイトルバー -->
  <div class="titlebar">
    <span class="titlebar-text">注記配置</span>
    <button class="titlebar-close" title="閉じる">✕</button>
  </div>

  <!-- 本体 -->
  <div class="body">

    <!-- 注記マスタ（連絡先一覧） -->
    <select class="sel" id="selContact" onchange="onContactChange()">
      <option value="">注記マスタ</option>
    </select>

    <!-- メッセージ選択（未読メッセージ一覧） -->
    <select class="sel" id="selMsg" onchange="onMsgChange()">
      <option value="">　</option>
    </select>

    <!-- 受信メッセージ -->
    <textarea class="ta-recv" id="taRecv" readonly></textarea>

    <!-- 送信/返信入力 -->
    <textarea class="ta-reply" id="taReply" placeholder="返信を入力..."></textarea>

    <!-- マスター登録（送信/返信） -->
    <div class="master-row">
      <button class="btn" onclick="sendMessage()">マスター登録</button>
    </div>

    <!-- 基本/表示 タブ -->
    <div class="tabs">
      <span class="tab active">基本</span>
      <span class="tab">表示</span>
    </div>

    <!-- 設定2カラム（デコレーション） -->
    <div class="settings">
      <div class="col-l">
        <label class="cb"><input type="checkbox"> 下線付き</label>
        <label class="cb"><input type="checkbox"> 斜体</label>
        <label class="cb"><input type="checkbox"> 太字</label>
        <div class="kijun">
          <span class="slbl">基準位置</span>
          <select class="ssel" style="flex:none;width:42px"><option>右下</option></select>
        </div>
      </div>
      <div class="col-r">
        <div class="srow"><span class="slbl" style="width:44px">サイズ</span><select class="ssel"><option>160</option></select></div>
        <div class="srow"><span class="slbl" style="width:44px">ピッチ</span><select class="ssel"><option>自動</option></select></div>
        <div class="srow"><span class="slbl" style="width:44px">フォント</span><select class="ssel"><option>メイリオ</option></select></div>
        <div class="srow"><span class="slbl" style="width:44px">角度(°)</span><input class="angle" type="text" value="0"></div>
        <div class="srow"><span class="slbl" style="width:44px">色</span><span class="swatch"></span><select class="ssel"><option>注記</option></select></div>
      </div>
    </div>

    <hr class="sep">

    <!-- 下部 3カラム（デコレーション） -->
    <div class="bottom">
      <div class="b-left">
        <label class="cb"><input type="checkbox"> ALL</label>
        <label class="cb disabled" style="height:19px;margin-bottom:1px"><input type="radio" name="layer" disabled><span style="font-size:12px;color:#a0a0a0">土台</span></label>
        <label class="cb"><input type="checkbox"> 1階小屋</label>
        <label class="cb"><input type="checkbox"> 1階母屋</label>
      </div>
      <div class="b-mid">
        <label class="cb"><input type="checkbox" checked> 引出線</label>
        <div class="srow"><span class="slbl" style="width:28px">大さ</span><select class="ssel"><option>1</option></select></div>
        <div class="srow"><span class="slbl" style="width:28px">線種</span><select class="ssel"><option>実線</option></select></div>
        <div class="radio-row"><span class="slbl" style="width:28px">形状</span><label><input type="radio" name="shape"> 無</label><label><input type="radio" name="shape" checked> 矢印</label><label><input type="radio" name="shape"> 丸</label></div>
        <div class="srow"><span class="slbl" style="width:28px">サイズ</span><select class="ssel"><option>小</option></select></div>
        <label class="cb"><input type="checkbox" checked> 下線</label>
      </div>
      <div class="b-right">
        <button class="btn">設定保存</button>
        <button class="btn">リセット</button>
      </div>
    </div>

  </div>

  <!-- ステータスバー -->
  <div class="statusbar" id="statusbar">待機中 | 次回更新: 60秒後</div>

</div>

<script>
/* ============================================================
   ★ GAS WebアプリURL
   ============================================================ */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbz_Xend_Lab0gEP9xbCX98NfWEsbl1aD_NCo_XsxrVzJ5bVTPLxMWf4501lQIcySXKfuQ/exec';

const POLL_MS = 60000;     // 取得間隔（GASの実行時間クォータの都合でこれ以上は縮めない）
const KEY_STORE = 'apiKey';

let nextFetchAt = 0;       // 次回取得の実時刻（tick回数ではなく時刻で判定する）
let allMessages = [];   // 未返信メッセージ
let allContacts = [];   // 連絡先一覧
let notifiedIds = loadNotifiedIds();  // 通知済みメッセージID
let fetching = false;
let timer = null;
let currentMode = 'idle';  // 'reply' | 'newmsg' | 'idle'
let currentTo = null;      // 選択中の会話ID（個チャ=userId / グループ=groupId）

/* ============================================================
   接続キー
   GASのWebアプリは ANYONE_ANONYMOUS 公開のため、URLを知られると
   誰でも叩けてしまう。キーはリポジトリが公開なのでソースに書けず、
   初回に入力してこの端末のlocalStorageにだけ保存する。
   ============================================================ */
function getKey() {
  try { return localStorage.getItem(KEY_STORE) || ''; } catch(e) { return ''; }
}

function askKey(msg) {
  const k = (window.prompt(msg || '接続キーを入力してください（初回のみ）') || '').trim();
  if (!k) return '';
  try { localStorage.setItem(KEY_STORE, k); } catch(e) { /* 保存できなくても今回は動く */ }
  return k;
}

function clearKey() {
  try { localStorage.removeItem(KEY_STORE); } catch(e) {}
}

/* ──── 初期化 ──── */
window.addEventListener('DOMContentLoaded', () => {
  Notification.requestPermission();
  if (!getKey()) askKey();
  refreshNow();

  // 非表示中はブラウザがタイマーを最大1分/回まで間引くため、
  // 復帰したタイミングで取りこぼしを即座に拾う
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refreshNow();
  });
  window.addEventListener('focus', refreshNow);
  window.addEventListener('online', refreshNow);

  // キーの入れ直し（ステータスバーをダブルクリック）
  document.getElementById('statusbar').addEventListener('dblclick', () => {
    if (askKey('接続キーを入力し直してください')) refreshNow();
  });
});

/* ──── カウントダウンタイマー ──── */
function startTimer() {
  clearInterval(timer);
  nextFetchAt = Date.now() + POLL_MS;
  timer = setInterval(() => {
    const remain = Math.max(0, Math.ceil((nextFetchAt - Date.now()) / 1000));
    if (Date.now() >= nextFetchAt) {
      clearInterval(timer);
      fetchAll().then(() => startTimer());
    } else {
      setStatus(`待機中 | 次回更新: ${remain}秒後`);
    }
  }, 1000);
}

/* ──── 即時取得してタイマーを張り直す ──── */
function refreshNow() {
  clearInterval(timer);
  fetchAll().then(() => startTimer());
}

/* ──── データ一括取得（メッセージ＋連絡先） ──── */
async function fetchAll() {
  if (fetching) return;
  fetching = true;
  setStatus('更新中...');
  try {
    const url = `${GAS_URL}?action=getAll&key=${encodeURIComponent(getKey())}`;
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();

    // GASのContentServiceはステータスコードを返せないため本文で判定する
    if (d.error === 'unauthorized') {
      clearKey();
      setStatus('接続キーが違います');
      return;
    }

    allContacts = d.contacts || [];
    allMessages = d.messages || [];

    buildContactList();
    updateBadge();
    notifyNewMessages();

    setStatus(allMessages.length > 0 ? `未読: ${allMessages.length}件` : '新着なし');
  } catch(e) {
    setStatus('接続エラー: ' + e.message);
  } finally {
    fetching = false;
  }
}

/* ──── 未通知のメッセージを送信者ごとに1件だけ通知 ──── */
function notifyNewMessages() {
  // 未読から消えたIDは覚えておく必要がないので捨てる（際限なく溜まるのを防ぐ）
  const liveIds = new Set(allMessages.map(m => m.id));
  notifiedIds = new Set([...notifiedIds].filter(id => liveIds.has(id)));

  // 新着を含む会話を新しい順に拾う（allMessages は新しい順）
  const freshTos = [];
  allMessages.forEach(m => {
    if (notifiedIds.has(m.id)) return;
    if (!freshTos.includes(m.to)) freshTos.push(m.to);
  });

  // 通知は古い会話から順に出す
  freshTos.slice().reverse().forEach(to => {
    const msgs = allMessages.filter(m => m.to === to);
    const latest = msgs[0];
    // グループは「グループ名 / 発言者」にして、個チャと取り違えないようにする
    const who = convType(to) === 'user' ? latest.sender : `${convName(to)} / ${latest.sender}`;
    const title = msgs.length > 1 ? `${who}（${msgs.length}件）` : who;
    showNotification(title, latest.message, to);
  });

  allMessages.forEach(m => notifiedIds.add(m.id));
  saveNotifiedIds();

  // 最新の送信者を自動選択。
  // ただし返信を書きかけのときは、宛先がすり替わって誤送信になるので触らない
  const draft = document.getElementById('taReply').value.trim();
  if (freshTos.length > 0 && !draft) {
    const sel = document.getElementById('selContact');
    sel.value = freshTos[0];
    onContactChange();
  }
}

/* ──── 通知済みIDの永続化（再起動のたびに再通知しないため） ──── */
function loadNotifiedIds() {
  try {
    return new Set(JSON.parse(localStorage.getItem('notifiedIds') || '[]'));
  } catch(e) {
    return new Set();
  }
}

function saveNotifiedIds() {
  try {
    localStorage.setItem('notifiedIds', JSON.stringify([...notifiedIds]));
  } catch(e) { /* 保存できなくても動作は継続 */ }
}

/* ──── 会話の種別と表示名 ──── */
// 個チャとグループを見分けられるようにする。
// グループ発言に個別で返してしまう事故を防ぐため、UI上も明示する。
function contactOf(to) {
  return allContacts.find(c => c.to === to) || null;
}

function convName(to) {
  const c = contactOf(to);
  if (c) return c.name;
  const m = allMessages.find(x => x.to === to);
  return m ? m.sender : to;
}

function convType(to) {
  const c = contactOf(to);
  if (c) return c.sourceType;
  const m = allMessages.find(x => x.to === to);
  return m ? m.sourceType : 'user';
}

function convLabel(to) {
  const t = convType(to);
  const n = convName(to);
  if (t === 'group') return '【G】' + n;
  if (t === 'room')  return '【複】' + n;
  return n;
}

/* ──── 連絡先リスト構築 ──── */
function buildContactList() {
  const sel = document.getElementById('selContact');
  const cur = sel.value;
  sel.innerHTML = '<option value="">注記マスタ</option>';

  allContacts.forEach(c => {
    const o = document.createElement('option');
    o.value = c.to;
    // 未読件数を表示（会話単位）
    const unread = allMessages.filter(m => m.to === c.to).length;
    const label = convLabel(c.to);
    o.textContent = unread > 0 ? `${label}（${unread}件）` : label;
    sel.appendChild(o);
  });

  if (cur) sel.value = cur;
}

/* ──── 連絡先選択変更 ──── */
function onContactChange() {
  const to = document.getElementById('selContact').value;
  currentTo = to;
  const selMsg = document.getElementById('selMsg');
  const taRecv = document.getElementById('taRecv');
  const taReply = document.getElementById('taReply');

  if (!to) {
    selMsg.innerHTML = '<option value="">　</option>';
    taRecv.value = '';
    taReply.placeholder = '返信を入力...';
    currentMode = 'idle';
    return;
  }

  // この会話の未読メッセージ（返信するまで1件に蓄積して表示）
  const msgs = allMessages.filter(m => m.to === to);

  if (msgs.length > 0) {
    // 未読メッセージあり → 返信モード
    currentMode = 'reply';
    taReply.placeholder = convType(to) === 'user'
      ? `${convName(to)} に返信...`
      : `${convName(to)}（グループ全員に届きます）に返信...`;
    selMsg.innerHTML = '';
    const o = document.createElement('option');
    o.value = to;
    const latest = msgs[0];
    const preview = latest.message.length > 12 ? latest.message.substring(0,12)+'…' : latest.message;
    o.textContent = msgs.length > 1
      ? `${latest.time}  ${preview}（他${msgs.length - 1}件）`
      : `${latest.time}  ${preview}`;
    selMsg.appendChild(o);
    taRecv.value = buildThreadText(msgs, to);
  } else {
    // 未読なし → 新規送信モード
    currentMode = 'newmsg';
    taReply.placeholder = '新規メッセージを入力...';
    selMsg.innerHTML = '<option value="">（新規送信）</option>';
    taRecv.value = '';
  }
}

/* ──── 同じ会話の未読を1つのスレッドとして連結 ──── */
function buildThreadText(msgs, to) {
  // グループは複数人が発言するので、誰の発言かを併記する
  const isGroup = convType(to) !== 'user';
  return msgs.slice().reverse()
    .map(m => isGroup ? `[${m.time} ${m.sender}] ${m.message}` : `[${m.time}] ${m.message}`)
    .join('\n');
}

/* ──── メッセージ選択変更 ──── */
function onMsgChange() {
  const to = document.getElementById('selMsg').value;
  const msgs = allMessages.filter(m => m.to === to);
  if (msgs.length > 0) {
    document.getElementById('taRecv').value = buildThreadText(msgs, to);
  }
}

/* ──── 送信（返信 or 新規） ──── */
async function sendMessage() {
  const text = document.getElementById('taReply').value.trim();
  if (!text) { alert('メッセージを入力してください'); return; }
  if (!currentTo) { alert('送信先を選択してください'); return; }

  // グループへの送信はメンバー全員に見えるので、誤爆しないよう一度確認する
  if (convType(currentTo) !== 'user') {
    if (!confirm(`「${convName(currentTo)}」のメンバー全員に送信します。よろしいですか？`)) {
      setStatus('送信を中止しました');
      return;
    }
  }

  setStatus('送信中...');
  try {
    let payload;

    if (currentMode === 'reply') {
      // 蓄積中の未読すべてに対する返信（最新のIDを代表に、全IDも渡す）
      const msgs = allMessages.filter(m => m.to === currentTo);
      const ids = msgs.map(m => m.id);
      payload = { action: 'reply', messageId: ids[0], messageIds: ids, reply: text };
    } else {
      // 新規送信
      payload = { action: 'sendNew', to: currentTo, text: text };
    }
    payload.key = getKey();

    const r = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify(payload)
    });
    const d = await r.json();

    if (d.error === 'unauthorized') {
      clearKey();
      setStatus('接続キーが違います（未送信）');
    } else if (d.success) {
      document.getElementById('taReply').value = '';
      setStatus('送信完了 ✓');
      // 即座に再取得
      await fetchAll();
    } else {
      setStatus('送信失敗: ' + (d.error || '不明'));
    }
  } catch(e) {
    setStatus('送信エラー: ' + e.message);
  }
}

/* ──── タスクバーバッジ更新 ──── */
function updateBadge() {
  const count = allMessages.length;
  if ('setAppBadge' in navigator) {
    if (count > 0) {
      navigator.setAppBadge(count).catch(() => {});
    } else {
      navigator.clearAppBadge().catch(() => {});
    }
  }
  updateAppIcon(count);
}

/* ──── アイコンの見た目変更（未読あり=赤バッジ付き） ──── */
let baseIconImg = null;
let iconState = null;  // 直前の描画状態（不要な再描画を防ぐ）

function updateAppIcon(count) {
  const state = count > 0 ? `unread:${Math.min(count, 100)}` : 'normal';
  if (state === iconState) return;

  document.title = count > 0 ? `(${count}) 注記配置` : '注記配置';

  const apply = () => {
    iconState = state;
    if (count === 0) {
      document.getElementById('appIcon').href = './icons/icon-192.png';
      return;
    }
    const size = 192;
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const ctx = cv.getContext('2d');
    ctx.drawImage(baseIconImg, 0, 0, size, size);

    // 右上に赤い通知バッジ
    const r = size * 0.28;
    const cx = size - r - 4, cy = r + 4;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = '#e60012';
    ctx.fill();
    ctx.lineWidth = size * 0.04;
    ctx.strokeStyle = '#fff';
    ctx.stroke();

    // バッジ内に件数
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${r * 1.1}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(count > 99 ? '99+' : String(count), cx, cy + r * 0.05);

    document.getElementById('appIcon').href = cv.toDataURL('image/png');
  };

  if (baseIconImg) {
    apply();
  } else {
    const img = new Image();
    img.onload = () => { baseIconImg = img; apply(); };
    img.src = './icons/icon-192.png';
  }
}

/* ──── Windows通知 ──── */
function showNotification(sender, text, to) {
  if (Notification.permission !== 'granted') return;
  // tag: 同じ送信者の通知は積み上げずに置き換える
  // requireInteraction: 席を外していても消えないよう、自動で閉じない
  const n = new Notification(`LINE: ${sender}`, {
    body: text,
    tag: to || sender,
    icon: './icons/icon-192.png',
    requireInteraction: true,
  });
  n.onclick = () => {
    window.focus();
    if (to) {
      document.getElementById('selContact').value = to;
      onContactChange();
    }
    n.close();
  };
}

/* ──── ステータス更新 ──── */
function setStatus(msg) {
  document.getElementById('statusbar').textContent = msg;
}
